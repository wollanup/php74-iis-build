# Compile PHP 7.4.33 NTS x64 (vc15) pour IIS a partir de la branche
# PHP-7.4-security-backports de remicollet/php-src-security : 7.4.33 + backports
# des correctifs de securite des branches maintenues, dont :
#   - CVE-2026-109618 / CVE-2026-109619 (PHP2Shell, 21/10/2026)
#   - release de securite du 19/11/2026 (CVE-2026-129289, CVE-2026-115560,
#     CVE-2026-126714, CVE-2026-129496, ...), voir NEWS
#
# A placer dans : .github/workflows/build-php74-nts.yml
# Lancement : onglet Actions > "Build PHP 7.4.33 NTS x64 (sec)" > Run workflow
# Resultat : artefact "artifacts-source-x64-nts" (zip PHP + debug/devel/test packs)

name: Build PHP 7.4.33 NTS x64 (sec)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SRC_REPO: remicollet/php-src-security
  # Tete de PHP-7.4-security-backports au 2026-11-20
  SRC_REF: 9a0a020ff74083b9d30666c041b515f0ff8f4d3c

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Recuperer les sources 7.4.33 + backports de securite
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Afficher les correctifs inclus
        shell: pwsh
        run: |
          git log -1 --format='%H %cd %s'
          Get-Content NEWS -TotalCount 60

      - name: Compiler (NTS, x64, vc15, PGO)
        uses: php/php-windows-builder/php@v1
        with:
          arch: x64
          ts: nts

      - name: Verifier le binaire
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts -Filter 'php-7.4.33-nts-Win32-*-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw "Zip PHP introuvable dans artifacts" }
          Get-FileHash $zip.FullName -Algorithm SHA256 | Format-List
          $dest = Join-Path $env:RUNNER_TEMP 'phptest'
          Expand-Archive $zip.FullName -DestinationPath $dest
          & "$dest\php.exe" -v
          & "$dest\php-cgi.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "php-cgi.exe ne demarre pas" }
          & "$dest\php.exe" -r 'echo "session.upload_progress.enabled=", var_export(ini_get("session.upload_progress.enabled"), true), PHP_EOL;'
